</head>

      }).join("");
      document.querySelectorAll(".add").forEach(b=>b.onclick=()=>updateQty(Number(b.dataset.p),1,true));
      document.querySelectorAll(".sub").forEach(b=>b.onclick=()=>updateQty(Number(b.dataset.m),-1,false));
    }
    function updateQty(id,delta,notify){
      const q=(cart.get(id)||0)+delta;
      if(q<=0) cart.delete(id); else cart.set(id,q);
      renderCards();
      renderCart();
      if(notify){
        const p=products.find(x=>x.id===id);
        showToast(`${ui[lang].toast} ${txt(p,"")} • ${ui[lang].inCart} ${totalItems()} ${ui[lang].orders}`);
      }
    }
    function renderCart(){
      if(!cart.size){
        el("citems").innerHTML=`<div style="padding:14px;color:#62806f">${ui[lang].empty}</div>`;
        el("total").textContent="0 ₸";
        updateCartBadges();
        return;
      }
      let total=0;
      el("citems").innerHTML=[...cart.entries()].map(([id,q])=>{
        const p=products.find(x=>x.id===id),s=q*p.price;
        total+=s;
        return `<div class="item"><div><strong>${txt(p,"")}</strong><div style="font-size:12px;color:#5f7b6d">${q} x ${p.price} ₸ = ${s} ₸</div></div><div class="qty"><button class="q" data-m="${id}">−</button><strong>${q}</strong><button class="q" data-p="${id}">+</button></div></div>`;
      }).join("");
      el("total").textContent=`${total} ₸`;
      updateCartBadges();
      document.querySelectorAll(".ci [data-m]").forEach(b=>b.onclick=()=>updateQty(Number(b.dataset.m),-1,false));
      document.querySelectorAll(".ci [data-p]").forEach(b=>b.onclick=()=>updateQty(Number(b.dataset.p),1,false));
    }
    const pad=n=>String(n).padStart(2,"0");
    function checkout(){if(!cart.size)return;const d=new Date();const date=`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;const time=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;let total=0;const lines=[...cart.entries()].map(([id,q],i)=>{const p=products.find(x=>x.id===id),s=q*p.price;total+=s;return `${i+1}. ${txt(p,"")}\n   ${q} x ${p.price} ₸ = ${s} ₸`}).join("\n\n");const msg=`━━━━━━━━━━━━━━━━━━\n🧾 Жаңа тапсырыс — QATTY TATTY\n\n📅 Күні:\n${date}\n\n⏰ Уақыты:\n${time}\n\n━━━━━━━━━━━━━━━━━━\n\n${lines}\n\n━━━━━━━━━━━━━━━━━━\n💰 Жалпы:\n${total} ₸\n\n📍 Адресіңіз қай жақта?\n━━━━━━━━━━━━━━━━━━\n\nQATTY TATTY website order`;window.open(`https://wa.me/87783772352?text=${encodeURIComponent(msg)}`,"_blank")}
    function applyLang(){document.documentElement.lang=lang;document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));el("heroSub").textContent=ui[lang].hero;el("menuBtn").textContent=ui[lang].cta;el("cartTitle").textContent=ui[lang].cart;el("totalLabel").textContent=ui[lang].total;el("checkout").textContent=ui[lang].wa;el("gameTitle").textContent=ui[lang].game;el("gameHint").textContent=ui[lang].hint;el("start").textContent=ui[lang].start;el("restart").textContent=ui[lang].restart;el("sound").textContent=ui[lang].gameBtn;renderHeader();renderTabs();renderCards();renderCart();renderGameStats()}
    const LS_KEY="qtty_game_best";
    const game={score:0,round:1,best:parseInt(localStorage.getItem(LS_KEY)||"0",10)||0};
    const box=el("box");
    function renderGameStats(){el("sScore").textContent=`${ui[lang].score}: ${game.score}`;el("sRound").textContent=`${ui[lang].round}: ${game.round}`;el("sBest").textContent=`${ui[lang].best}: ${game.best}`}
    function buildRound(){
      box.innerHTML="";
      const winIndex=Math.floor(Math.random()*6);
      for(let i=0;i<6;i+=1){
        const btn=document.createElement("button");
        btn.type="button";
        btn.className="cup";
        btn.textContent="🧋";
        btn.onclick=()=>{
          if(btn.disabled) return;
          box.querySelectorAll(".cup").forEach((c,idx)=>{
            c.disabled=true;
            c.classList.add(idx===winIndex?"win":"lose");
            c.textContent=idx===winIndex?"🥞":"🧋";
          });
          if(i===winIndex){
            game.score+=10;
            showToast(ui[lang].win);
          }else{
            game.score=Math.max(0,game.score-2);
            showToast(ui[lang].lose);
          }
          if(game.score>game.best){game.best=game.score;localStorage.setItem(LS_KEY,String(game.best))}
          renderGameStats();
        };
        box.appendChild(btn);
      }
    }
    function nextRound(){game.round+=1;buildRound();renderGameStats()}
    function restart(){game.score=0;game.round=1;buildRound();renderGameStats()}
    function openCart(){el("overlay").classList.add("open");el("cart").classList.add("open")}
    function closeCart(){el("overlay").classList.remove("open");el("cart").classList.remove("open")}
    window.addEventListener("scroll",()=>{const y=window.scrollY*-.08;el("heroInner").style.transform=`translateY(${y}px)`},{passive:true});
    el("menuBtn").onclick=()=>el("menu").scrollIntoView({behavior:"smooth"});
    el("openCart").onclick=openCart; el("fabCart").onclick=openCart; el("closeCart").onclick=closeCart; el("overlay").onclick=closeCart; el("checkout").onclick=checkout;
    document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});
    el("start").onclick=nextRound;
    el("restart").onclick=restart;
    el("sound").onclick=buildRound;
    applyLang(); restart();
  </script>
</body>
</html>
